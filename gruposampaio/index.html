<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Acesso Restrito - Grupo Sampaio</title>

<link rel="icon" type="image/png" href="divina.png">

<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg-deep: #000000;
  --glass-bg: rgba(20, 20, 25, 0.7);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text-primary: #ffffff;
  --text-secondary: #a1a1a6;
  --accent-red: #FF453A;
  --accent-green: #2ecc71;
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-stack);
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-transform: uppercase;
}

.security-card {
  width: min(90%, 380px);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 40px 30px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.8);
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.icon-lock {
  font-size: 3rem;
  margin-bottom: 15px;
}

h2 {
  margin: 0 0 5px;
  font-size: 1.3rem;
  letter-spacing: 2px;
  color: var(--accent-red);
}

p {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.5;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

input {
  width: 100%;
  padding: 18px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--glass-border);
  color: #fff;
  border-radius: 12px;
  font-size: 1.2rem;
  text-align: center;
  letter-spacing: 8px;
  margin-bottom: 20px;
  outline: none;
  transition: all 0.3s;
}

input:focus {
  border-color: var(--text-primary);
  background: rgba(0,0,0,0.6);
}

input.error {
  border-color: var(--accent-red);
  color: var(--accent-red);
  animation: shake 0.4s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ==========================================
   COMPONENTE ANTI-ROBÔ (ESTILO CLOUDFLARE)
   ========================================== */
.antibot-container {
  display: flex;
  align-items: center;
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 25px;
  cursor: pointer;
  transition: border 0.3s;
  text-align: left;
}
.antibot-container:hover { border-color: #555; }
.antibot-container.verified { border-color: var(--accent-green); cursor: default; }

.antibot-box {
  width: 24px;
  height: 24px;
  border: 2px solid #555;
  border-radius: 4px;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  transition: all 0.3s;
  flex-shrink: 0;
}

/* Animação de Loading (Girando) */
.antibot-box.loading {
  border: 2px solid transparent;
  border-top-color: var(--text-secondary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* Marca de Verificado (Verde) */
.antibot-box.success {
  border-color: var(--accent-green);
  background: var(--accent-green);
}
.antibot-box.success::after {
  content: '✔';
  color: #fff;
  font-size: 14px;
  font-weight: bold;
}

@keyframes spin { 100% { transform: rotate(360deg); } }

.antibot-text {
  flex: 1;
  font-size: 0.8rem;
  color: #ccc;
  letter-spacing: 1px;
  text-transform: none;
}
.antibot-logo {
  font-size: 0.6rem;
  color: #666;
  text-align: right;
  line-height: 1.2;
}
.antibot-logo span { font-weight: bold; color: #888; }

/* ==========================================
   BOTÃO DESBLOQUEAR
   ========================================== */
button {
  width: 100%;
  padding: 18px;
  border-radius: 12px;
  border: none;
  background: #fff;
  color: #000;
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s;
}

button:active:not(:disabled) {
  transform: scale(0.96);
}

button:disabled {
  background: #333;
  color: #666;
  cursor: not-allowed;
}
</style>
</head>
<body>

<div class="security-card">
  <div class="icon-lock">🔒</div>
  <h2>Área Restrita</h2>
  <p>Acesso exclusivo para auditores e diretoria.<br>Insira a chave mestre.</p>

  <input type="password" id="master-pass" placeholder="••••••••" onkeyup="checkEnter(event)">
  
  <div class="antibot-container" id="bot-widget" onclick="verificarHumano()">
    <div class="antibot-box" id="bot-box"></div>
    <div class="antibot-text" id="bot-text">Verificar que sou humano</div>
    <div class="antibot-logo">Protegido por<br><span>GS Security</span></div>
  </div>

  <button id="btn-submit" onclick="validarAcesso()" disabled>DESBLOQUEAR</button>
</div>

<script>
// === DEFINA A SENHA MESTRE AQUI ===
const SENHA_MESTRE = "gs2026"; 

let isHuman = false;
let isVerifying = false;

// Lógica do Sistema Anti-Robô
function verificarHumano() {
  if (isHuman || isVerifying) return; // Se já verificou ou está verificando, ignora o clique
  isVerifying = true;
  
  const box = document.getElementById('bot-box');
  const text = document.getElementById('bot-text');
  const widget = document.getElementById('bot-widget');
  const btn = document.getElementById('btn-submit');

  // Estado de Loading
  box.classList.add('loading');
  text.innerText = "Analisando conexão...";

  // Simula o tempo de verificação (1.5 segundos)
  setTimeout(() => {
    box.classList.remove('loading');
    box.classList.add('success');
    widget.classList.add('verified');
    text.innerText = "Conexão segura verificada";
    text.style.color = "#2ecc71";
    
    isHuman = true;
    btn.disabled = false; // Libera o botão de desbloquear
  }, 1500);
}

// Lógica de Desbloqueio da Senha Mestre
function validarAcesso() {
  if (!isHuman) return; // Trava extra de segurança

  const input = document.getElementById('master-pass');
  
  if(input.value === SENHA_MESTRE) {
    // Cria o crachá de segurança na memória do celular
    sessionStorage.setItem("gs_acesso_liberado", "SIM");
    
    // Redireciona para o Hub usando a URL limpa (ajustado para funcionar com a máscara)
    window.location.replace("./hub");
  } else {
    // Animação de erro na senha
    input.classList.remove('error');
    void input.offsetWidth; 
    input.classList.add('error');
    input.value = '';
    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
  }
}

// Permitir apertar Enter só se já tiver verificado ser humano
function checkEnter(event) {
  if (event.key === "Enter" && isHuman) {
    validarAcesso();
  }
}
</script>

</body>
</html>
