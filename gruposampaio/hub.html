<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Hub - Don Tallento</title>
<script>
  if (sessionStorage.getItem("gs_acesso_liberado") !== "SIM") {

  }
  window.history.replaceState({}, '', '/gruposampaio/');
</script>
<link rel="icon" type="image/png" href="gs.png">

<style>
/* =========================================
   VERDADEIRO APPLE DESIGN SYSTEM
   ========================================= */
:root {
  /* Light Theme */
  --bg-body: #F2F2F7;
  --bg-card: #FFFFFF;
  --bg-modal: rgba(255, 255, 255, 0.85);
  --text-main: #000000;
  --text-secondary: #3C3C4399; /* Cor nativa de subtítulos no iOS */
  --border-color: #C6C6C8;
  --divider-color: rgba(60, 60, 67, 0.15);
  --ios-blue: #007AFF;
  --ios-red: #FF3B30;
  
  --mesh-1: rgba(0, 122, 255, 0.08);
  --mesh-2: rgba(94, 92, 230, 0.08);
  --mesh-3: rgba(52, 199, 89, 0.05);
}

[data-theme="dark"] {
  /* Dark Theme */
  --bg-body: #000000;
  --bg-card: #1C1C1E;
  --bg-modal: rgba(28, 28, 30, 0.85);
  --text-main: #FFFFFF;
  --text-secondary: #EBEBF599;
  --border-color: #38383A;
  --divider-color: rgba(84, 84, 88, 0.65);
  --ios-blue: #0A84FF;
  --ios-red: #FF453A;
  
  --mesh-1: rgba(10, 132, 255, 0.15);
  --mesh-2: rgba(94, 92, 230, 0.15);
  --mesh-3: rgba(255, 69, 58, 0.08);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg-body);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  margin: 0;
  overflow: hidden;
  height: 100vh; 
  width: 100vw;
  transition: background-color 0.4s ease, color 0.4s ease;
}

/* ==========================================
   FUNDO PROFISSIONAL (MESH GRADIENT)
   ========================================== */
.mesh-bg {
  position: fixed; inset: 0; z-index: -1;
  background-color: var(--bg-body);
  background-image:
    radial-gradient(at 20% 20%, var(--mesh-1) 0px, transparent 50%),
    radial-gradient(at 80% 0%, var(--mesh-2) 0px, transparent 50%),
    radial-gradient(at 50% 100%, var(--mesh-3) 0px, transparent 50%);
  animation: breathe 12s ease-in-out infinite alternate;
  transition: background-image 0.4s ease, background-color 0.4s ease;
}
@keyframes breathe {
  0% { transform: scale(1); }
  100% { transform: scale(1.05); }
}

/* ==========================================
   HEADER & SPLASH
   ========================================== */
.theme-toggle {
  position: absolute; top: 20px; right: 20px;
  background: transparent; border: none;
  color: var(--ios-blue); padding: 10px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  z-index: 100; transition: opacity 0.2s;
}
.theme-toggle:active { opacity: 0.5; }

#splash-screen {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--bg-body);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
}
#splash-screen.hidden { opacity: 0; visibility: hidden; }
.splash-logos { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.splash-logos img { height: 40px; max-width: 120px; object-fit: contain; }
.splash-spinner {
  width: 24px; height: 24px; border: 3px solid var(--divider-color);
  border-top-color: var(--ios-blue); border-radius: 50%;
  animation: spin 1s linear infinite; margin-top: 30px;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

/* ==========================================
   LAYOUT PRINCIPAL
   ========================================== */
#main-content {
  display: flex; flex-direction: column; align-items: center; 
  padding: 60px 20px 20px; max-width: 600px; margin: 0 auto;
  opacity: 0; transform: translateY(10px); transition: all 0.6s ease;
}
#main-content.active { opacity: 1; transform: translateY(0); }

.hub-header { text-align: center; margin-bottom: 35px; width: 100%; }
.hub-header h2 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
.hub-header p { color: var(--text-secondary); font-size: 1.05rem; line-height: 1.4; margin-top: 8px; font-weight: 400; }

/* ESTILO DE LISTA AGRUPADA (iOS SETTINGS) */
.menu-group {
  width: 100%; background: var(--bg-card);
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.btn-menu {
  display: flex; align-items: center;
  width: 100%; padding: 0; margin: 0;
  background: transparent; border: none;
  cursor: pointer; transition: background-color 0.2s;
  text-align: left;
}
.btn-menu:active { background-color: var(--divider-color); }

.menu-icon-wrapper {
  padding: 14px 16px; display: flex; align-items: center; justify-content: center;
}
.menu-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.icon-blue { background: var(--ios-blue); }
.icon-purple { background: #5E5CE6; }

.menu-content {
  flex: 1; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 16px 0;
  border-bottom: 0.5px solid var(--divider-color);
}
.btn-menu:last-child .menu-content { border-bottom: none; }

.menu-text { display: flex; flex-direction: column; gap: 3px; }
.menu-title { color: var(--text-main); font-size: 1.05rem; font-weight: 500; letter-spacing: -0.2px; }
.menu-subtitle { color: var(--text-secondary); font-size: 0.85rem; font-weight: 400; }

.menu-chevron { color: var(--text-secondary); opacity: 0.5; }

/* RODAPÉ */
.footer-note { 
  margin-top: 40px; text-align: center; color: var(--text-secondary); 
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px;
}
.btn-reload {
  margin-top: 15px; background: transparent; border: none; color: var(--ios-blue);
  cursor: pointer; font-size: 0.9rem; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px; transition: opacity 0.2s;
}
.btn-reload:active { opacity: 0.5; }

/* ==========================================
   MODAL DE SENHA (NATIVO iOS ALERT)
   ========================================== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transition: opacity 0.25s ease;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal-content {
  width: 270px; background: var(--bg-modal);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 14px; text-align: center;
  transform: scale(1.1); transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.modal-overlay.show .modal-content { transform: scale(1); }

.modal-header { padding: 20px 16px 15px; }
.modal-content h4 { margin: 0 0 6px; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.2px; }
.modal-content p { font-size: 0.85rem; color: var(--text-main); margin: 0; font-weight: 400; line-height: 1.3; }

.modal-input-container { padding: 0 16px 20px; }
.modal-content input {
  width: 100%; padding: 8px 10px; 
  background: var(--bg-body); border: 0.5px solid var(--border-color);
  color: var(--text-main); border-radius: 6px; font-size: 0.95rem;
  font-family: inherit; transition: all 0.2s;
}
.modal-content input:focus { outline: none; border-color: var(--ios-blue); }
.modal-content input.error { color: var(--ios-red); border-color: var(--ios-red); animation: shakeX 0.4s; }

.modal-btns { 
  display: flex; border-top: 0.5px solid var(--divider-color);
}
.btn-modal { 
  flex: 1; padding: 12px; background: transparent; border: none;
  color: var(--ios-blue); font-size: 1.05rem; font-family: inherit;
  cursor: pointer; transition: background-color 0.2s;
}
.btn-modal:active { background-color: rgba(0,0,0,0.05); }
.btn-cancel { font-weight: 400; border-right: 0.5px solid var(--divider-color); }
.btn-confirm { font-weight: 600; }

.hidden { display: none !important; }

/* ==========================================
   RESPONSIVIDADE E OFFLINE
   ========================================== */
#offline-screen {
  position: fixed; inset: 0; z-index: 999999;
  background: var(--bg-body); display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px;
}
#offline-screen svg { color: var(--text-secondary); margin-bottom: 15px; }

@media (max-width: 600px) {
  #main-content { padding-top: 40px; }
  .hub-header h2 { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="mesh-bg"></div>

<button class="theme-toggle" id="btn-theme" title="Alternar Tema">
  <svg id="icon-sun" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
  <svg id="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<div id="offline-screen">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
  <p style="color: var(--text-main); font-weight: 600; font-size: 1.1rem; margin:0 0 5px;">Sem Conexão</p>
  <p style="color: var(--text-secondary); margin:0;">O hub requer rede para acessar os módulos.</p>
</div>

<div id="splash-screen">
  <div class="splash-logos">
      <img src="divina.png" alt="Divina" onerror="this.style.display='none'" />
      <img src="opy.png" alt="Opy" onerror="this.style.display='none'" />
      <img src="cheppitos.png" alt="Cheppitos" onerror="this.style.display='none'" />
      <img src="fornelle.png" alt="Fornelle" onerror="this.style.display='none'" />
  </div>
  <div class="splash-spinner"></div>
</div>

<div id="main-content">
  <div class="hub-header">
    <h2>Central de Auditoria</h2>
    <p>Selecione um módulo para iniciar a avaliação das unidades.</p>
  </div>

  <div class="menu-group" id="menu-list-container">
    </div>

  <div class="footer-note">
    DON TALLENTO • 2026<br>
    <button class="btn-reload" onclick="window.location.reload(true)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      Sincronizar
    </button>
  </div>
</div>

<div id="password-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h4 id="modal-title">Autenticação</h4>
      <p>Insira a senha para acessar este módulo.</p>
    </div>
    
    <div class="modal-input-container">
      <input type="password" id="pass-input" placeholder="Senha" onkeyup="checkEnter(event)" autocomplete="off"/>
    </div>
    
    <div class="modal-btns">
      <button class="btn-modal btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-modal btn-confirm" onclick="validarSenha()">Acessar</button>
    </div>
  </div>
</div>

<script>
// --- THEME TOGGLE LOGIC ---
const themeToggle = document.getElementById('btn-theme');
const iconSun = document.getElementById('icon-sun');
const iconMoon = document.getElementById('icon-moon');

function setTheme(isDark) {
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    iconMoon.classList.add('hidden');
    iconSun.classList.remove('hidden');
    localStorage.setItem('apple_theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    iconSun.classList.add('hidden');
    iconMoon.classList.remove('hidden');
    localStorage.setItem('apple_theme', 'light');
  }
}

const savedTheme = localStorage.getItem('apple_theme');
if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) { setTheme(true); } else { setTheme(false); }
themeToggle.addEventListener('click', () => { const isDark = document.documentElement.getAttribute('data-theme') === 'dark'; setTheme(!isDark); });

/* ==========================================
   SISTEMA DE DETECÇÃO DE INTERNET
   ========================================== */
function checkConnection() {
  const offlineScreen = document.getElementById('offline-screen');
  if (navigator.onLine) {
    offlineScreen.style.display = 'none';
  } else {
    offlineScreen.style.display = 'flex';
  }
}
window.addEventListener('online', checkConnection);
window.addEventListener('offline', checkConnection);
checkConnection(); 

/* ==========================================
   CONFIGURAÇÃO DOS MÓDULOS
   ========================================== */
const questionarios = [
  { 
    id: "operacional",
    nome: "Controle Operacional", 
    desc: "Qualidade, estrutura e higiene.",
    arquivo: "checklistoperacional.html", 
    senha: "@Qualidade01",
    colorClass: "icon-blue",
    icon: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><polyline points="9 14 11 16 15 12"></polyline></svg>`
  },
  { 
    id: "divina",
    nome: "Checklist Divina", 
    desc: "Padrão de produção.",
    arquivo: "checklistdivina.html", 
    senha: "@Operações01",
    colorClass: "icon-purple",
    icon: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`
  }
];

let checklistSelecionado = null;

// Animação de entrada do Splash
window.onload = () => {
  renderizarMenu();
  setTimeout(() => {
    const splash = document.getElementById('splash-screen');
    const main = document.getElementById('main-content');
    
    splash.classList.add('hidden'); 
    setTimeout(() => {
      splash.style.display = 'none';
      main.classList.add('active');
    }, 600);
  }, 1200); // Fica 1.2s na tela de carregamento para parecer um app abrindo
};

function renderizarMenu() {
  const container = document.getElementById('menu-list-container');
  container.innerHTML = '';

  questionarios.forEach((q) => {
    const btn = document.createElement('button'); 
    btn.className = 'btn-menu';
    btn.onclick = () => abrirModal(q);
    
    btn.innerHTML = `
      <div class="menu-icon-wrapper">
        <div class="menu-icon ${q.colorClass}">
          ${q.icon}
        </div>
      </div>
      <div class="menu-content">
        <div class="menu-text">
          <span class="menu-title">${q.nome}</span>
          <span class="menu-subtitle">${q.desc}</span>
        </div>
        <div class="menu-chevron">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>
    `;
    container.appendChild(btn);
  });
}

const modal = document.getElementById('password-modal');
const inputSenha = document.getElementById('pass-input');
const modalTitle = document.getElementById('modal-title');

function abrirModal(questionario) {
  checklistSelecionado = questionario;
  modalTitle.innerText = questionario.nome;
  modal.classList.add('show');
  inputSenha.value = ''; 
  inputSenha.classList.remove('error');
  
  setTimeout(() => inputSenha.focus(), 100); 
}

function fecharModal() {
  modal.classList.remove('show');
  setTimeout(() => { checklistSelecionado = null; }, 250);
}

function validarSenha() {
  if (!checklistSelecionado) return;

  if (inputSenha.value === checklistSelecionado.senha) {
    inputSenha.style.borderColor = "var(--ios-blue)";
    inputSenha.style.color = "var(--ios-blue)";
    setTimeout(() => {
        window.location.replace(checklistSelecionado.arquivo);
    }, 200);
    
  } else {
    inputSenha.classList.remove('error');
    void inputSenha.offsetWidth; // Trigger reflow
    inputSenha.classList.add('error');
    inputSenha.value = '';
    inputSenha.focus();
    if (navigator.vibrate) navigator.vibrate(200);
  }
}

function checkEnter(event) { if (event.key === "Enter") validarSenha(); }

</script>

</body>
</html>
